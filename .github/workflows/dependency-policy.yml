name: Dependency Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: .NET 10 and dependency policy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check package policy
        shell: pwsh
        run: ./scripts/check-package-policy.ps1
      - name: Test package policy rejection cases
        shell: pwsh
        run: ./scripts/test-package-policy.ps1
      - name: Restore and audit all projects
        run: dotnet restore StarterTemplate.slnx --force-evaluate -warnaserror:NU1510,NU1605,NU1608,NU1900,NU1901,NU1902,NU1903,NU1904,NU1905
      - name: Restore pinned .NET tools
        run: dotnet tool restore
      - name: Verify formatter compatibility
        run: dotnet run --project tools/ST.SourceFormatting/ST.SourceFormatting.csproj --configuration Release --no-restore -- --self-test
