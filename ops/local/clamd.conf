Foreground true
User clamav
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
LogTime true
LogClean false
LogVerbose false
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
StreamMaxLength 11M
MaxFileSize 11M
MaxScanSize 50M
MaxRecursion 16
MaxFiles 1000
MaxThreads 2
ReadTimeout 30
CommandReadTimeout 30
SendBufTimeout 30
ConcurrentDatabaseReload false
AlertEncrypted true
AlertExceedsMax true
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanArchive true
